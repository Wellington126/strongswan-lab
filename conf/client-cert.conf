connections {
    lab {
        version = 2
        local_addrs  = 10.99.0.20
        remote_addrs = 10.99.0.10
        proposals = aes256-sha256-modp2048

        local {
            auth = pubkey
            certs = client.crt
            id = client.lab
        }

        remote {
            auth = pubkey
            cacerts = ca.crt
            id = server.lab
        }

        children {
            lab-tunnel {
                local_ts  = 10.99.0.20/32
                remote_ts = 10.99.0.10/32
                esp_proposals = aes256-sha256-modp2048
                mode = tunnel
                start_action = start
            }
        }
    }
}
